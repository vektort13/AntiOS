name: AntiOS hardened Windows build

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "antios/**"
      - "scripts/build-hardened-windows.ps1"
      - "antios_entry.py"
      - "antios_gui_entry.py"
      - "antios_guard_entry.py"
      - "pyproject.toml"
      - ".github/workflows/windows-hardened.yml"

permissions:
  contents: read

jobs:
  hardened-windows:
    runs-on: windows-latest
    timeout-minutes: 75

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install nuitka zstandard ordered-set
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows icons
        shell: pwsh
        run: |
          python scripts/build-icons.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate hardened build script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path ".\scripts\build-hardened-windows.ps1"), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count) {
            $errors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Build hardened binaries
        shell: pwsh
        run: |
          ./scripts/build-hardened-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test hardened CLI
        shell: pwsh
        run: |
          .\hardened-dist\AntiOS\AntiOS.exe --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\hardened-dist\AntiOS\AntiOS.exe version --json | ConvertFrom-Json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test hardened GUI
        shell: pwsh
        run: |
          .\hardened-dist\AntiOS-GUI\AntiOS-GUI.exe --self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\hardened-dist\AntiOS-GUI\AntiOS-GUI.exe --ui-self-test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test hardened Guard
        shell: pwsh
        run: |
          .\hardened-dist\AntiOS-Guard\AntiOS-Guard.exe status | ConvertFrom-Json | Out-Null
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify no loose AntiOS Python source
        shell: pwsh
        run: |
          $source = Get-ChildItem .\hardened-dist -Recurse -File -Filter *.py -ErrorAction SilentlyContinue
          if ($source) {
            $source.FullName | ForEach-Object { Write-Error "Loose Python source in hardened output: $_" }
            exit 1
          }
          $pyc = Get-ChildItem .\hardened-dist -Recurse -File -Filter *.pyc -ErrorAction SilentlyContinue
          if ($pyc) {
            $pyc.FullName | ForEach-Object { Write-Error "Loose Python bytecode in hardened output: $_" }
            exit 1
          }

      - uses: actions/upload-artifact@v4
        with:
          name: AntiOS-hardened-windows
          path: |
            hardened-dist/**
          if-no-files-found: error
