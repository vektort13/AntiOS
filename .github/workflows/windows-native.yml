name: AntiOS Engine security integration

on:
  pull_request:
    paths:
      - "antios/engine.py"
      - "antios/antivirus.py"
      - "antios/guard.py"
      - "antios/incident_response.py"
      - "antios/windows_platform_sensors.py"
      - "tests/test_windows_platform_sensors.py"
      - "tests/test_native_*"
      - "tests/test_guard_unified.py"
      - ".github/workflows/windows-native.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install AntiOS and test dependencies
        run: python -m pip install -e . pytest
      - name: Test AntiOS-owned engine, Guard and packaging isolation
        run: python -m pytest -v tests/test_native_engine_adversarial.py tests/test_native_runtime_boundary.py tests/test_guard_unified.py tests/test_incident_response.py
      - name: Verify Authenticode driver hash against Windows SignTool
        run: python -m pytest -v tests/test_windows_platform_sensors.py::test_pe_authenticode_sha256_matches_signtool

  native-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install AntiOS and test dependencies
        run: python -m pip install -e . pytest
      - name: Test AntiOS-owned engine, Guard and packaging isolation
        run: python -m pytest -v tests/test_native_engine_adversarial.py tests/test_native_runtime_boundary.py tests/test_guard_unified.py tests/test_incident_response.py
