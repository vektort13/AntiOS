name: Website

on:
  pull_request:
    paths:
      - "docs/**"
      - "tests/test_website.py"
      - "tests/site/**"
      - ".github/workflows/website.yml"
  push:
    branches: [master]
    paths:
      - "docs/**"
      - "tests/test_website.py"
      - "tests/site/**"
      - ".github/workflows/website.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: antios-website-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify website
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/sphere.js
      - name: Verify animation lifecycle and resource limits
        run: node --test tests/site/sphere.test.cjs
      - name: Verify links, translations and standalone assets
        run: python -m unittest discover -s tests -p test_website.py -v

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name != 'pull_request'
    needs: verify
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
