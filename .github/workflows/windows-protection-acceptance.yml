name: Windows AntiOS Engine acceptance

on:
  pull_request:
    paths:
      - "antios/engine.py"
      - "antios/antivirus.py"
      - "antios/guard.py"
      - "antios/protection.py"
      - "scripts/guard-*.ps1"
      - "scripts/protection-first-run.ps1"
      - "installer/AntiOS.nsi"
      - "tests/test_unified_engine.py"
      - "tests/test_guard_unified.py"
      - ".github/workflows/windows-protection-acceptance.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-engine-windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install AntiOS and tests
        shell: pwsh
        run: |
          python -m pip install -e . pytest
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Parse Guard startup and native trust PowerShell
        shell: pwsh
        run: |
          foreach ($path in @(
            ".\scripts\guard-startup.ps1",
            ".\scripts\guard-trust.ps1",
            ".\scripts\protection-first-run.ps1"
          )) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors
            ) | Out-Null
            if ($errors.Count) {
              $errors | Format-List | Out-String | Write-Error
              exit 1
            }
          }

      - name: Native signatures, ZIP, PE and Guard integration
        shell: pwsh
        run: |
          python -m pytest -v tests/test_unified_engine.py tests/test_guard_unified.py tests/test_release_payload.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify packaged CLI without an external antivirus service
        shell: pwsh
        run: |
          $cli = (Get-Command antios -ErrorAction Stop).Source
          python scripts/smoke-antivirus.py $cli
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Ensure protection reports no pre-execution enforcement
        shell: pwsh
        run: |
          $status = antios protection-status --json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($status.engine.database_freshness -ne 'local') {
            throw 'AntiOS Engine did not report local signatures.'
          }
          if (-not $status.capabilities.standalone_detection_engine) {
            throw 'Bundled AntiOS Engine failed readiness.'
          }
          if ($status.capabilities.pre_execution_blocking -or $status.production_primary_antivirus) {
            throw 'AntiOS cannot claim unimplemented pre-execution enforcement.'
          }
          if ($status.engine.peer_identity -like 'windows-service:*') {
            throw 'Native AntiOS Engine must not depend on the ClamAV peer.'
          }
          $status | ConvertTo-Json -Depth 10 | Set-Content -Encoding utf8 protection-status.json

      - name: Preserve native acceptance result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: antios-native-windows-acceptance
          path: protection-status.json
          if-no-files-found: ignore
