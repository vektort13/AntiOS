name: Website verification

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [master, "feat/holographic-site-*"]
    paths:
      [
        "docs/**",
        "tests/test_website.py",
        "tests/site/**",
        ".github/workflows/site-verification.yml",
      ]
  pull_request:
    paths:
      [
        "docs/**",
        "tests/test_website.py",
        "tests/site/**",
        ".github/workflows/site-verification.yml",
      ]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/sphere.js
      - name: Verify animation lifecycle and resource limits
        run: node --test tests/site/sphere.test.cjs
      - name: Verify links, translations and standalone assets
        run: python -m unittest discover -s tests -p test_website.py -v
