name: AntiOS Store MSIX

on:
  pull_request:
    paths:
      - "antios/**"
      - "antios_gui_entry.py"
      - "store/**"
      - "scripts/build-store-msix.ps1"
      - "release/**"
      - ".github/workflows/store-msix.yml"
  workflow_dispatch:
    inputs:
      identity_name:
        description: "Partner Center Package/Identity/Name"
        required: false
        default: "DargonsITP.AntiOS"
      publisher:
        description: "Partner Center Package/Identity/Publisher"
        required: false
        default: "CN=D0D34602-FED2-4FE0-B705-18B9041C45F3"
      publisher_display_name:
        description: "Publisher display name"
        required: false
        default: "DargonITP"
      package_version:
        description: "Store version (Major.Minor.Build.0)"
        required: false
        default: "3.0.2.0"

permissions:
  contents: read

jobs:
  build-store-msix:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller -e .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows icon resources
        shell: pwsh
        run: |
          python scripts/build-icons.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Store GUI executable
        shell: pwsh
        run: |
          pyinstaller --clean --noconfirm --onedir --contents-directory _gui --uac-admin --icon .\build\icons\app_main.ico --add-data "antios/assets/icons;antios/assets/icons" --version-file release/windows-gui-version.txt --windowed --name AntiOS-GUI antios_gui_entry.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build unsigned Store MSIX
        shell: pwsh
        run: |
          $identity = "${{ github.event.inputs.identity_name || 'DargonsITP.AntiOS' }}"
          $publisher = "${{ github.event.inputs.publisher || 'CN=D0D34602-FED2-4FE0-B705-18B9041C45F3' }}"
          $publisherDisplay = "${{ github.event.inputs.publisher_display_name || 'DargonITP' }}"
          $version = "${{ github.event.inputs.package_version || '3.0.2.0' }}"
          .\scripts\build-store-msix.ps1 `
            -IdentityName $identity `
            -Publisher $publisher `
            -PublisherDisplayName $publisherDisplay `
            -PackageVersion $version

      - uses: actions/upload-artifact@v4
        with:
          name: AntiOS-Store-MSIX
          path: store-output/AntiOS.msix
          if-no-files-found: error
