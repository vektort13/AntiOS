# Public prerelease from an exact successful master release workflow.
# Windows files are unsigned; do not claim Authenticode identity.
name: Publish unsigned AntiOS 3.0.02 Alpha

on:
  workflow_run:
    workflows: ["AntiOS release"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: antios-3-0-02-unsigned-publication
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'master' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Confirm master commit and release identity
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < release/VERSION)" = "3.0.2a1"
          test "$(tr -d '\r\n' < release/TAG)" = "V.3.0.02-Alpha"
          current="$(gh api "repos/$GITHUB_REPOSITORY/branches/master" --jq '.commit.sha')"
          test "$current" = "$BUILD_SHA"
          tag="V.3.0.02-Alpha"
          if git ls-remote --exit-code --refs "https://github.com/$GITHUB_REPOSITORY.git" "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Refusing to replace existing tag $tag" >&2
            exit 1
          fi
          count="$(gh api --paginate --slurp "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
            jq --arg tag "$tag" '[.[][] | select(.tag_name == $tag)] | length')"
          test "$count" = "0"

      - name: Download exact successful CI artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY"             --name AntiOS-release-artifacts --dir release-artifacts/windows
          gh run download "$BUILD_RUN" --repo "$GITHUB_REPOSITORY"             --name AntiOS-linux-release-artifacts --dir release-artifacts/linux

      - name: Validate exactly eight build files and provenance
        env:
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(release-artifacts/windows/python-dist/antios-3.0.2a1-*.whl)
          sdists=(release-artifacts/windows/python-dist/antios-3.0.2a1.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          files=(
            release-artifacts/windows/AntiOS-Setup.exe
            release-artifacts/windows/AntiOS-Setup.exe.sha256
            release-artifacts/windows/AntiOS-windows-x64.zip
            release-artifacts/windows/AntiOS-windows-x64.zip.sha256
            "${wheels[0]}"
            "${sdists[0]}"
            release-artifacts/linux/AntiOS-linux-x64.tar.gz
            release-artifacts/linux/AntiOS-linux-x64.tar.gz.sha256
          )
          test "${#files[@]}" -eq 8
          for f in "${files[@]}"; do test -s "$f" && test ! -L "$f"; done
          test "$(find release-artifacts -type f | wc -l | tr -d '[:space:]')" -eq 8
          (cd release-artifacts/windows &&
            sha256sum -c AntiOS-Setup.exe.sha256 &&
            sha256sum -c AntiOS-windows-x64.zip.sha256)
          (cd release-artifacts/linux &&
            sha256sum -c AntiOS-linux-x64.tar.gz.sha256)
          unzip -tq release-artifacts/windows/AntiOS-windows-x64.zip
          unzip -p release-artifacts/windows/AntiOS-windows-x64.zip BUILD_INFO.txt |
            grep -Fqx "Commit: $BUILD_SHA"
          unzip -p release-artifacts/windows/AntiOS-windows-x64.zip BUILD_INFO.txt |
            grep -Fq "Unsigned direct-download build"
          tar -xOzf release-artifacts/linux/AntiOS-linux-x64.tar.gz ./BUILD_INFO.txt |
            grep -Fqx "Commit: $BUILD_SHA"

      - name: Create, upload and publish UNSIGNED prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
          BUILD_RUN: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          repo="$GITHUB_REPOSITORY"
          tag="V.3.0.02-Alpha"
          test "$(gh api "repos/$repo/branches/master" --jq '.commit.sha')" = "$BUILD_SHA"

          {
            echo '# AntiOS 3.0.02 Alpha — UNSIGNED prerelease'
            echo
            echo '**Windows binaries are NOT digitally signed.** Windows SmartScreen may warn. SHA-256 checksums verify file integrity, not publisher identity.'
            echo
            cat release/RELEASE_NOTES.md
            echo
            echo "Provenance: GitHub Actions run https://github.com/$repo/actions/runs/$BUILD_RUN from source commit $BUILD_SHA."
          } > "$RUNNER_TEMP/notes.md"

          release_id="$(
            jq -n --arg tag "$tag" --arg sha "$BUILD_SHA" --arg body "$(cat "$RUNNER_TEMP/notes.md")"               '{tag_name:$tag,target_commitish:$sha,name:"AntiOS V.3.0.02-Alpha (UNSIGNED)",body:$body,draft:true,prerelease:true}' |
            gh api --method POST "repos/$repo/releases" --input - --jq '.id'
          )"
          test -n "$release_id"
          gh api "repos/$repo/releases/$release_id" |
            jq -e --arg tag "$tag" --arg sha "$BUILD_SHA" \
              '.draft and .prerelease and .tag_name == $tag and .target_commitish == $sha' >/dev/null

          shopt -s nullglob
          files=(
            release-artifacts/windows/AntiOS-Setup.exe
            release-artifacts/windows/AntiOS-Setup.exe.sha256
            release-artifacts/windows/AntiOS-windows-x64.zip
            release-artifacts/windows/AntiOS-windows-x64.zip.sha256
            release-artifacts/windows/python-dist/antios-3.0.2a1-*.whl
            release-artifacts/windows/python-dist/antios-3.0.2a1.tar.gz
            release-artifacts/linux/AntiOS-linux-x64.tar.gz
            release-artifacts/linux/AntiOS-linux-x64.tar.gz.sha256
          )
          test "${#files[@]}" -eq 8
          for f in "${files[@]}"; do
            name="$(basename "$f")"
            expected="sha256:$(sha256sum "$f" | cut -d ' ' -f1)"
            curl --fail-with-body --silent --show-error --retry 2               -H "Authorization: Bearer $GH_TOKEN"               -H "Accept: application/vnd.github+json"               -H "Content-Type: application/octet-stream"               --data-binary "@$f"               "https://uploads.github.com/repos/$repo/releases/$release_id/assets?name=$name"               > "$RUNNER_TEMP/upload-result.json"
            jq -e --arg name "$name" --arg digest "$expected"               '.name == $name and .state == "uploaded" and .digest == $digest'               "$RUNNER_TEMP/upload-result.json" >/dev/null
          done
          test "$(gh api "repos/$repo/releases/$release_id" --jq '.assets | length')" = "8"
          jq -n --arg tag "$tag" --arg sha "$BUILD_SHA" \
            '{tag_name:$tag,target_commitish:$sha,draft:false,prerelease:true}' |
            gh api --method PATCH "repos/$repo/releases/$release_id" --input - >/dev/null
          gh api "repos/$repo/releases/$release_id" |
            jq -e --arg tag "$tag" \
              '(.draft | not) and .prerelease and .tag_name == $tag and (.assets | length) == 8' >/dev/null
          test "$(gh api "repos/$repo/git/ref/tags/$tag" --jq '.object.sha')" = "$BUILD_SHA"
          echo "Published unsigned prerelease at https://github.com/$repo/releases/tag/$tag"
