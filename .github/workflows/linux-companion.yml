name: AntiOS Linux companion

on:
  push:
    branches: ["master"]
  pull_request:
    paths:
      - "antios/**"
      - "tests/**"
      - "docs/LINUX.md"
      - "pyproject.toml"
      - ".github/workflows/linux-companion.yml"
  workflow_dispatch:

concurrency:
  group: antios-linux-\${{ github.workflow }}-\${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-companion:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install test/build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav-daemon python3-tk xvfb xauth
          python -m pip install --upgrade pip
          python -m pip install pytest pyinstaller -e .
      - name: Linux companion tests
        run: |
          python -m pytest -rs tests/test_linux_companion.py tests/test_cli.py tests/test_coexistence.py
          python -m antios coexistence-status --json
          python -m antios quick-check --json
      - name: Build Linux CLI and GUI
        run: |
          pyinstaller --clean --noconfirm --onedir --contents-directory _linux --console --name AntiOS antios_entry.py
          pyinstaller --clean --noconfirm --onedir --contents-directory _linux_gui --windowed --name AntiOS-GUI antios_gui_entry.py
          ./dist/AntiOS/AntiOS --version
          ./dist/AntiOS/AntiOS coexistence-status --json
      - name: Package
        run: |
          mkdir -p linux-package
          cp -a dist/AntiOS linux-package/
          cp -a dist/AntiOS-GUI linux-package/
          cp README.md LICENSE NOTICE docs/LINUX.md linux-package/
          tar -C linux-package -czf AntiOS-linux-x64.tar.gz .
          sha256sum AntiOS-linux-x64.tar.gz > AntiOS-linux-x64.tar.gz.sha256
      - name: Verify packaged Linux GUI
        run: |
          smoke_root="$(mktemp -d)"
          trap 'rm -rf "$smoke_root"' EXIT
          tar -xzf AntiOS-linux-x64.tar.gz -C "$smoke_root"
          "$smoke_root/AntiOS-GUI/AntiOS-GUI" --self-test
          xvfb-run -a "$smoke_root/AntiOS-GUI/AntiOS-GUI" --ui-self-test
      - uses: actions/upload-artifact@v4
        with:
          name: AntiOS-linux-x64
          path: |
            AntiOS-linux-x64.tar.gz
            AntiOS-linux-x64.tar.gz.sha256
