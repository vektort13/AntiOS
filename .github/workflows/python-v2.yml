name: AntiOS v2 tests

on:
  push:
    branches: ["master"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: antios-v2-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-source-boundary:
    name: Public/private source boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Reject accidentally published proprietary source
        run: python scripts/check-public-boundary.py

  clamav-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install real ClamD and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clamav-daemon
          python -m pip install pytest -e .
      - name: Test real engine with inert rules and archives
        env:
          ANTIOS_REQUIRE_CLAMD: "1"
          ANTIOS_TEST_CLAMD: /usr/sbin/clamd
        run: python -m pytest tests/test_clamav_integration.py -v


  windows10-api-proxy:
    name: Windows 10-era API proxy (not Win10 certification)
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Show proxy runner version
        shell: pwsh
        run: |
          Get-ComputerInfo | Select-Object WindowsProductName,WindowsVersion,OsBuildNumber | Format-List

      - name: Install
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Compatibility smoke
        shell: pwsh
        run: |
          python -m pytest -rs tests/test_system_info.py tests/test_health.py tests/test_doctor.py tests/test_guard.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m antios --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Select this Python installation's Tcl/Tk libraries
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $runtime = python -c "import json, sys, _tkinter; print(json.dumps(dict(prefix=sys.base_prefix, tcl=_tkinter.TCL_VERSION, tk=_tkinter.TK_VERSION)))" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tcl = Join-Path $runtime.prefix "tcl\tcl$($runtime.tcl)"
          $tk = Join-Path $runtime.prefix "tcl\tk$($runtime.tk)"
          if (-not (Test-Path (Join-Path $tcl 'init.tcl')) -or -not (Test-Path (Join-Path $tk 'tk.tcl'))) {
            throw 'Python Tcl/Tk libraries are incomplete.'
          }
          "TCL_LIBRARY=$tcl" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
          "TK_LIBRARY=$tk" | Out-File $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pip install -e .

      - name: Test
        run: python -m pytest -rs
